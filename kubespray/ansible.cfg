[defaults]
# Punta ai ruoli e alle collezioni del repo Kubespray clonato
# Personalizza con KUBESPRAY_DIR se il checkout è in una posizione diversa
roles_path         = ${KUBESPRAY_DIR:-~/kubespray}/roles
collections_paths  = ${KUBESPRAY_DIR:-~/kubespray}/collections

remote_user        = ubuntu
private_key_file   = ~/.ssh/id_rsa
host_key_checking  = False
timeout            = 60

# Output strutturato e tempi di esecuzione per task
stdout_callback    = yaml
callbacks_enabled  = timer, profile_tasks

# Numero di host paralleli — adattare alla dimensione del cluster
forks              = 10

[ssh_connection]
# ControlPersist mantiene la connessione SSH aperta tra i task (molto più veloce)
ssh_args       = -o ControlMaster=auto -o ControlPersist=30m -o ConnectionAttempts=100 -o UserKnownHostsFile=/dev/null
pipelining     = True
