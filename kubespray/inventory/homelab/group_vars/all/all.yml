---
# ── Cluster ────────────────────────────────────────────────────────────────────
cluster_name: ninjam-k8s

# ── Versione Kubernetes ────────────────────────────────────────────────────────
# Verificare la compatibilità con la versione Kubespray in uso:
# https://github.com/kubernetes-sigs/kubespray#supported-components
kube_version: 1.36.4

# ── Versione Kubespray ─────────────────────────────────────────────────────────
# Tag release da usare per il clone. Vuoto = branch main.
kubespray_version: v2.32.0

# ── etcd ────────────────────────────────────────────────────────────────────────
# Dischi lenti (fdatasync > 1s): il default 5000ms causa elezioni leader spurie.
# Equivalente di --etcd-election-timeout 10s in k3s (qui si esprime in ms).
etcd_election_timeout: "10000"

# ── DNS upstream ───────────────────────────────────────────────────────────────
upstream_dns_servers:
  - 1.1.1.1
  - 8.8.8.8

# ── Ottimizzazione download binari ────────────────────────────────────────────
download_run_once: true
download_localhost: false

# ── NTP ────────────────────────────────────────────────────────────────────────
ntp_enabled: true
ntp_manage_config: true
ntp_servers:
  - 0.it.pool.ntp.org
  - 1.it.pool.ntp.org
  - 2.it.pool.ntp.org

# ── Calico (CNI) ────────────────────────────────────────────────────────────────────
kube_network_plugin: calico
calico_ipip_mode: Always
calico_vxlan_mode: Never
calico_network_backend: bird
calico_mtu: 1480
kube_service_addresses: 10.96.0.0/12
kube_pods_subnet: 10.244.0.0/16
kube_proxy_mode: ipvs
kube_proxy_strict_arp: true

# ── SSH ────────────────────────────────────────────────────────────────────────
ansible_user: ubuntu
ansible_become: true
