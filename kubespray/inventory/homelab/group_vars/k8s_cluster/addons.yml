---
# ── Registry ───────────────────────────────────────────────────────────────────
# Abilitato con StorageClass local-path per Kubespray v2.32.0 (evita errore conditional)
registry_enabled: true
registry_storage_class: "local-path"

# ── Helm ───────────────────────────────────────────────────────────────────────
helm_enabled: true

# ── Metrics Server ─────────────────────────────────────────────────────────────
# Necessario per `kubectl top nodes/pods` e per l'HorizontalPodAutoscaler.
metrics_server_enabled: true
metrics_server_resizer_nanny_cpu: "5m"
metrics_server_resizer_nanny_mem: "32Mi"

# ── Kubernetes Dashboard ────────────────────────────────────────────────────────
# La dashboard upstream è stata rimossa da Kubespray (v2.21+): il ruolo
# kubernetes-apps/kubernetes-dashboard NON esiste più e il flag
# dashboard_enabled non ha alcun effetto su Kubespray.
# L'installazione avviene post-deploy via script dedicato, invocato
# automaticamente da deploy.sh a fine installazione:
#   bash kubespray/scripts/install-dashboard.sh
# Il flag `install_dashboard:` (impostato da init-project.sh) decide
# se deploy.sh la esegue automaticamente (true) o no (false).
install_dashboard: true

# ── Ingress Controller (nginx) ─────────────────────────────────────────────────
# Espone servizi all'esterno del cluster via MetalLB.
# La porta 80/443 viene esposta su un IP del pool MetalLB.
ingress_nginx_enabled: true
# ingress_nginx_host_network: true

# ── Cert Manager ───────────────────────────────────────────────────────────────
# Gestione automatica certificati TLS (Let's Encrypt o CA interna).
cert_manager_enabled: true
# cert_manager_namespace: cert-manager

# ── MetalLB ────────────────────────────────────────────────────────────────────
# Load Balancer per homelab (sostituisce il cloud provider LB).
# Assegna IP pubblici ai servizi LoadBalancer.
metallb_enabled: true
metallb_protocol: layer2
metallb_config:
  address_pools:
    primary:
      ip_range:
        - 192.168.0.130-192.168.0.145
      auto_assign: true
      avoid_buggy_ips: true
  layer2:
    - primary

# ── kube-vip ───────────────────────────────────────────────────────────────────
# HA del control plane tramite VIP (sostituisce HAProxy esterno).
# Il VIP viene annunciato via ARP su eth0 dai nodi control plane.
kube_vip_enabled: true
kube_vip_arp_enabled: true
kube_vip_controlplane_enabled: true
kube_vip_address: 192.168.0.80
kube_vip_interface: eth0
kube_vip_services_enabled: false
loadbalancer_apiserver:
  address: "{{ kube_vip_address }}"
  port: 6443
kube_vip_dns_mode: first
kube_vip_cp_detect: false
kube_vip_leasename: plndr-cp-lock
kube_vip_lb_fwdmethod: local

# ── Local Path Provisioner ──────────────────────────────────────────────────────
# Storage class basata su hostPath — utile per homelab senza storage esterno.
local_volume_provisioner_enabled: false
