- hosts: all
  become: true
  vars:
    packer_build: false   # sovrascritta da Packer con --extra-vars "packer_build=true"

  tasks:
    # ── Task per VM normali (post-clone Terraform) ──────────────────────────
    - name: Install common packages
      apt:
        name:
          - curl
          - wget
          - git
          - vim
          - python3
          - python3-pip
        state: present
        update_cache: yes
      when: not packer_build

    # ── Locale (sempre) ─────────────────────────────────────────────────────
    - name: Ensure locale it_IT.UTF-8 is generated
      locale_gen:
        name: it_IT.UTF-8
        state: present

    - name: Set default locale
      lineinfile:
        path: /etc/default/locale
        regexp: '^LANG='
        line: 'LANG=it_IT.UTF-8'
        create: yes

    # ── Preparazione template (solo durante Packer build) ────────────────────
    - name: Enable and start qemu-guest-agent
      systemd:
        name: qemu-guest-agent
        enabled: yes
        state: started
      when: packer_build

    - name: Clean apt cache
      apt:
        autoclean: yes
        autoremove: yes
      when: packer_build

    # Reset cloud-init: indispensabile affinché venga eseguito al primo boot
    # di ogni VM clonata da questo template.
    - name: Reset cloud-init state
      command: cloud-init clean --logs
      when: packer_build

    # Rimuovere le host key SSH: verranno rigenerate univoche ad ogni boot.
    - name: Remove SSH host keys
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/ssh/ssh_host_rsa_key
        - /etc/ssh/ssh_host_rsa_key.pub
        - /etc/ssh/ssh_host_ecdsa_key
        - /etc/ssh/ssh_host_ecdsa_key.pub
        - /etc/ssh/ssh_host_ed25519_key
        - /etc/ssh/ssh_host_ed25519_key.pub
      when: packer_build

    # Svuotare machine-id: ogni VM clonata ne otterrà uno univoco al primo boot.
    - name: Truncate machine-id
      copy:
        content: ""
        dest: /etc/machine-id
        owner: root
        group: root
        mode: '0444'
      when: packer_build

    - name: Ensure /var/lib/dbus/machine-id is a symlink to /etc/machine-id
      file:
        src: /etc/machine-id
        dest: /var/lib/dbus/machine-id
        state: link
        force: yes
      when: packer_build

    - name: Clean temp files
      shell: rm -rf /tmp/* /var/tmp/*
      args:
        warn: false
      when: packer_build
