---
- hosts: all
  become: true
  vars:
    # Sovrascritta da Packer con --extra-vars '{"packer_build":true}'
    packer_build: false

  tasks:
    # ── Task per VM normali (post-clone Terraform) ──────────────────────────
    - name: Install common packages (Debian/Ubuntu)
      apt:
        name:
          - curl
          - wget
          - git
          - vim
          - python3
          - python3-pip
        state: present
        update_cache: yes
      when: not (packer_build | bool) and ansible_os_family == "Debian"

    - name: Install common packages (Rocky/RHEL)
      dnf:
        name:
          - curl
          - wget
          - git
          - vim
          - python3
          - python3-pip
        state: present
      when: not (packer_build | bool) and ansible_os_family == "RedHat"

    # ── Locale (sempre) ─────────────────────────────────────────────────────
    - name: Ensure locales are generated (Debian/Ubuntu)
      locale_gen:
        name: "{{ item }}"
        state: present
      loop:
        - it_IT.UTF-8
        - en_GB.UTF-8
      when: ansible_os_family == "Debian"

    - name: Set default locale en_US.UTF-8 (Debian/Ubuntu)
      lineinfile:
        path: /etc/default/locale
        regexp: '{{ item.regexp }}'
        line: '{{ item.line }}'
        create: yes
      loop:
        - { regexp: '^LANG=', line: 'LANG=en_US.UTF-8' }
        - { regexp: '^LC_TIME=', line: 'LC_TIME=en_GB.UTF-8' }
      when: ansible_os_family == "Debian"

    - name: Install langpacks for locale (Rocky/RHEL)
      dnf:
        name:
          - glibc-langpack-en
        state: present
      when: ansible_os_family == "RedHat"

    - name: Set default locale (Rocky/RHEL)
      command: localectl set-locale LANG=en_US.UTF-8 LC_TIME=en_GB.UTF-8
      changed_when: false
      when: ansible_os_family == "RedHat"

    # ── Preparazione template (solo durante Packer build) ────────────────────
    - name: Enable and start qemu-guest-agent
      systemd:
        name: qemu-guest-agent
        enabled: yes
        state: started
      when: packer_build | bool

    - name: Clean apt cache (Debian/Ubuntu)
      apt:
        autoclean: yes
        autoremove: yes
      when: packer_build | bool and ansible_os_family == "Debian"

    - name: Clean dnf cache (Rocky/RHEL)
      command: dnf clean all
      changed_when: false
      when: packer_build | bool and ansible_os_family == "RedHat"

    # Reset cloud-init: indispensabile affinché venga eseguito al primo boot
    # di ogni VM clonata da questo template.
    - name: Reset cloud-init state
      command: cloud-init clean --logs
      when: packer_build | bool

    # Rimuovere le host key SSH: verranno rigenerate univoche ad ogni boot.
    - name: Remove SSH host keys
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/ssh/ssh_host_rsa_key
        - /etc/ssh/ssh_host_rsa_key.pub
        - /etc/ssh/ssh_host_ecdsa_key
        - /etc/ssh/ssh_host_ecdsa_key.pub
        - /etc/ssh/ssh_host_ed25519_key
        - /etc/ssh/ssh_host_ed25519_key.pub
      when: packer_build | bool

    # Pulire il machine-id: ogni VM clonata avrà un ID unico al primo boot.
    - name: Truncate machine-id
      copy:
        content: ""
        dest: /etc/machine-id
        force: yes
      when: packer_build | bool

    # Pulire i log per partire da uno stato pulito.
    - name: Clean logs
      shell: |
        find /var/log -type f -name '*.log' -exec truncate -s 0 {} \;
        find /var/log -type f -name '*.gz' -delete
      changed_when: false
      when: packer_build | bool
