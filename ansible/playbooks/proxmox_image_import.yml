- hosts: localhost
  connection: local
  vars:
    ubuntu_version: "{{ lookup('env', 'UBUNTU_VERSION') | default('24.04', true) }}"
    workspace: "{{ lookup('env','GITHUB_WORKSPACE') | default(lookup('env','PWD'), true) }}"
    image_path: "{{ workspace }}/packer/output/ubuntu-{{ ubuntu_version }}.qcow2"
    template_name: "ubuntu-{{ ubuntu_version }}-template"
  tasks:
    - name: Import image to Proxmox as a VM
      community.general.proxmox:
        api_user: "{{ lookup('env','PROXMOX_USER') }}"
        api_password: "{{ lookup('env','PROXMOX_PASSWORD') }}"
        api_host: "{{ lookup('env','PROXMOX_HOST') }}"
        node: "{{ lookup('env','PROXMOX_NODE') | default('pve') }}"
        vmid: 9001
        name: "{{ template_name }}"
        storage: "{{ lookup('env','PROXMOX_STORAGE') | default('local-lvm') }}"
        iso: ""
        clone: no
        force: yes
        state: present
        scsi0: "{{ image_path }},backup=0"
        ostype: l26
        accept_eula: yes
      delegate_to: localhost

    - name: Convert VM to template
      community.general.proxmox:
        api_user: "{{ lookup('env','PROXMOX_USER') }}"
        api_password: "{{ lookup('env','PROXMOX_PASSWORD') }}"
        api_host: "{{ lookup('env','PROXMOX_HOST') }}"
        node: "{{ lookup('env','PROXMOX_NODE') | default('pve') }}"
        vmid: 9001
        template: true
        state: present
      delegate_to: localhost
